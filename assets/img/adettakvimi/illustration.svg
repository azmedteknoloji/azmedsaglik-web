<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-labelledby="t">
  <title id="t">Calendar illustration</title>
  <rect x="10" y="20" width="340" height="350" rx="28" fill="#FFFFFF"/>
  <rect x="10" y="20" width="340" height="72" rx="28" fill="#0F6088"/>
  <rect x="10" y="64" width="340" height="28" fill="#0F6088"/>
  <rect x="80" y="4" width="14" height="40" rx="7" fill="#E8B86B"/>
  <rect x="266" y="4" width="14" height="40" rx="7" fill="#E8B86B"/>
  <circle cx="180" cy="56" r="16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="70 31" transform="rotate(-90 180 56)"/>
  <g>
    <!-- 7 x 5 day grid -->
    <g fill="#EEF1F5">
      <circle cx="50" cy="130" r="17"/><circle cx="93" cy="130" r="17"/><circle cx="136" cy="130" r="17"/><circle cx="179" cy="130" r="17"/><circle cx="222" cy="130" r="17"/><circle cx="265" cy="130" r="17"/><circle cx="308" cy="130" r="17"/>
      <circle cx="50" cy="178" r="17"/><circle cx="93" cy="178" r="17"/><circle cx="136" cy="178" r="17"/><circle cx="179" cy="178" r="17"/><circle cx="222" cy="178" r="17"/><circle cx="265" cy="178" r="17"/><circle cx="308" cy="178" r="17"/>
      <circle cx="50" cy="226" r="17"/><circle cx="93" cy="226" r="17"/><circle cx="136" cy="226" r="17"/><circle cx="179" cy="226" r="17"/><circle cx="222" cy="226" r="17"/><circle cx="265" cy="226" r="17"/><circle cx="308" cy="226" r="17"/>
      <circle cx="50" cy="274" r="17"/><circle cx="93" cy="274" r="17"/><circle cx="136" cy="274" r="17"/><circle cx="179" cy="274" r="17"/><circle cx="222" cy="274" r="17"/><circle cx="265" cy="274" r="17"/><circle cx="308" cy="274" r="17"/>
      <circle cx="50" cy="322" r="17"/><circle cx="93" cy="322" r="17"/><circle cx="136" cy="322" r="17"/><circle cx="179" cy="322" r="17"/>
    </g>
    <!-- period days -->
    <g fill="#D9607A"><circle cx="136" cy="130" r="17"/><circle cx="179" cy="130" r="17"/><circle cx="222" cy="130" r="17"/><circle cx="265" cy="130" r="17"/></g>
    <!-- fertile window -->
    <g fill="#5FA9C9"><circle cx="93" cy="226" r="17"/><circle cx="136" cy="226" r="17"/><circle cx="179" cy="226" r="17"/><circle cx="265" cy="226" r="17"/></g>
    <!-- ovulation -->
    <circle cx="222" cy="226" r="17" fill="#2B2A5E"/>
    <circle cx="222" cy="226" r="24" fill="none" stroke="#E8B86B" stroke-width="3"/>
    <!-- predicted next period -->
    <g fill="none" stroke="#D9607A" stroke-width="2.5" stroke-dasharray="4 4"><circle cx="93" cy="322" r="16"/><circle cx="136" cy="322" r="16"/><circle cx="179" cy="322" r="16"/></g>
  </g>
</svg>
